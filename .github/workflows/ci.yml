name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      # The Copy as smoke tests exercise Git for Windows' ANSI curl.exe. Install it explicitly:
      # hosted runner images are mutable, and a missing tool is a test failure under CI by design.
      # This is test infrastructure only and is not included in shipped artifacts. release.yml
      # uses the same installation before it runs the same smoke tests.
      - name: Install Git for Windows for the Copy as round trips
        shell: pwsh
        run: choco install git --yes --no-progress

      # Test-only. The Copy as smoke tests run the generated Python snippet against the real `requests`
      # package, and a missing tool fails under CI by design so the security evidence cannot silently
      # skip. Uses the runner image's preinstalled python.exe (the one the tests find on PATH); every
      # package is pinned to an exact version and hash (eng/ci-test-requirements.txt). This workflow
      # has no secrets, and nothing here reaches the shipped product. release.yml runs the same smoke
      # tests and installs the same file with the same command; keep the two steps identical.
      - name: Install Python requests for the Copy as round trips
        shell: pwsh
        run: 'python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r eng/ci-test-requirements.txt'

      - name: Verify analyzers, build, audit, and tests
        shell: pwsh
        run: ./eng/verify.ps1 -IncludeInstaller
